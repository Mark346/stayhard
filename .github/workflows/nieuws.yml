name: Nieuws bijwerken

on:
  schedule:
    - cron: "15 4 * * *"   # elke dag rond 06:15 Nederlandse tijd
  workflow_dispatch:        # handmatig starten via de knop "Run workflow"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Nieuws ophalen
        run: python update_news.py
      - name: Opslaan
        run: |
          git config user.name "dagstart-bot"
          git config user.email "dagstart-bot@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Nieuws $(date +%F)"
          git push
